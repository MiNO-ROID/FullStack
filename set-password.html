<!DOCTYPE html>
<html lang="en-NZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set your password · Auckland Map Centre</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="signin">
    <form class="panel" id="pwForm" novalidate>
      <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="16" cy="16" r="14" />
        <path d="M16 3.5l3 12.5-3 12.5-3-12.5z" fill="currentColor" />
      </svg>
      <div>
        <h1>Set your password</h1>
        <p class="help" id="who" style="margin-top:6px">Checking your link…</p>
      </div>
      <div class="afield"><label for="pw1">New password</label><input id="pw1" type="password" required minlength="8"
          autocomplete="new-password" disabled></div>
      <div class="afield"><label for="pw2">Type it again</label><input id="pw2" type="password" required minlength="8"
          autocomplete="new-password" disabled></div>
      <p class="help">At least 8 characters. A short sentence is easier to remember than a jumble.</p>
      <p class="help err" id="msg" aria-live="polite" hidden></p>
      <button class="abtn primary" type="submit" id="go" data-label="Save password" disabled>Save password</button>
      <a class="back" href="index.html#staff">Go to staff sign in</a>
    </form>
  </main>

  <script type="module">
    import { sb } from "./supabase.js";
    const $ = (s) => document.querySelector(s);
    const say = (text, bad = true) => { const m = $("#msg"); m.textContent = text; m.hidden = !text; m.classList.toggle("err", bad); };
    const enable = (on) => ["#pw1", "#pw2", "#go"].forEach(s => { $(s).disabled = !on; });

    // invite and reset link
    const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    const linkError = params.get("error_description");

    async function start() {
      if (linkError) { $("#who").textContent = "This link can't be used."; say(`${linkError.replace(/\+/g, " ")}. Ask the shop owner for a new invite, or use Forgot your password on the sign-in page.`); return; }
      let { data: { session } } = await sb.auth.getSession();
      if (!session) {
        await new Promise(r => setTimeout(r, 600));
        ({ data: { session } } = await sb.auth.getSession());
      }
      if (!session) { $("#who").textContent = "No invite or reset link found."; say("Open this page from the link in your email. Links can only be used once and expire after a day."); return; }
      $("#who").textContent = `For ${session.user.email}`;
      enable(true); $("#pw1").focus();
    }

    $("#pwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const a = $("#pw1").value, b = $("#pw2").value;
      if (a.length < 8) { say("Use at least 8 characters."); $("#pw1").focus(); return; }
      if (a !== b) { say("The two passwords don't match."); $("#pw2").focus(); return; }
      const btn = $("#go"); btn.disabled = true; btn.textContent = "Saving…"; say("");
      const { error } = await sb.auth.updateUser({ password: a });
      btn.disabled = false; btn.textContent = btn.dataset.label;
      if (error) { say(error.message || "The password wasn't saved. Try again."); return; }
      enable(false);
      say("Password saved. Taking you to the staff area…", false);
      setTimeout(() => { location.href = "index.html#staff"; }, 1200);
    });

    start();
  </script>
</body>

</html>
