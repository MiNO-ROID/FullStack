<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set your password | Auckland Map Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="staffApp">
  <div class="signin">
    <form class="panel" id="passwordForm" novalidate>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="assets/icons/compass.svg#icon"/></svg>
      <div><h1>Set your password</h1><p class="help" style="margin-top:6px">Auckland Map Centre staff area</p></div>
      <div class="afield"><label for="pass">New password</label><input id="pass" type="password" required minlength="8" autocomplete="new-password"></div>
      <p class="help" id="msg" role="alert">Use at least 8 characters.</p>
      <button class="abtn primary" type="submit">Save password</button>
      <a class="back" href="index.html#staff">Go to staff sign in</a>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient(
  "https://ctfmdagftjbjmrxcvifw.supabase.co",
  "sb_publishable_vlMtSjFVVXrntElJYlrUzA_wPpJ1_TO"
);
const msg = document.getElementById("msg");

// The link in the invite email signs the person in, so Supabase already knows whose password this is
document.getElementById("passwordForm").addEventListener("submit", async e => {
  e.preventDefault();
  const password = document.getElementById("pass").value;
  if (password.length < 8) { msg.textContent = "Use at least 8 characters."; return; }
  const btn = e.target.querySelector('[type="submit"]');
  btn.disabled = true;
  const { data: { session } } = await db.auth.getSession();
  if (!session) { msg.textContent = "This link has expired. Ask the shop owner for a new one."; btn.disabled = false; return; }
  const { error } = await db.auth.updateUser({ password });
  msg.textContent = error ? error.message : "Password saved. You can now sign in.";
  btn.disabled = false;
});
</script>
</body>
</html>
