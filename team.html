<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Management</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/team.css" />
  </head>
  <body>
    <!-- Dashboard -->

    <div class="dashboard">
      <!-- left-sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <svg
            id="icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="16" cy="16" r="14" />
            <path d="M16 3.5l3 12.5-3 12.5-3-12.5z" fill="currentColor" />
            <path
              d="M3.5 16l12.5-2 12.5 2-12.5 2z"
              fill="currentColor"
              fill-opacity=".35"
              stroke="none"
            />
          </svg>
        </div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item" title="Prices">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M3 12V4h8l10 10-8 8z" />
              <circle cx="7.5" cy="8.5" r="1.5" />
            </svg>
          </a>

          <a href="./team.html" class="nav-item" title="Team">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="9" cy="8" r="3.5" />
              <path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5" />
              <path
                d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"
              />
            </svg>
          </a>

          <a href="#" class="nav-item" title="">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18" />
              <path d="M9.5 20v-6h5v6" />
            </svg>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <a href="#" class="nav-item" title="Logout">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10" />
            </svg>
          </a>
        </div>
      </aside>

      <!-- main contain -->
      <main class="main-content">
        <!-- page-header -->
        <header class="page-header">
          <h1>Team</h1>
          <p>
            Who can sign in to change price and images. Customers can't sign up.
          </p>
        </header>

        <!-- team-content -->
        <section class="team-layout">
          <!-- left: team-members -->
          <div class="team-members">
            <div class="section-card">
              <h2>People</h2>
              <div class="divider"></div>

              <!-- TEAM MEMBER -->
               <div id="team-members-list">
              <!-- <div class="member">
                        <div class="member-avatar" id="avatar">
                            M
                        </div>

                        <div class="member-info">
                            <p class="member-email" id="email">
                                manager@aucklandmapcentre.co.nz
                            </p>
                            <span class="member-status" id="status">
                                Signed in now
                            </span>
                        </div>

                        <span class="role-badge" id="role">
                            Owner
                        </span>
                        
                    </div> -->
                </div>
            </div>
          </div>

          <!-- right: invitation form -->
          <div class="invite-section">
            <div class="section-card">
              <h2>Invite someone</h2>

              <form id="invite-form">
                <!-- EMAIL -->
                <div class="form-group">
                  <label for="email"> Email </label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@aucklandmapcentre.co.nz"
                    required
                  />
                </div>

                <!-- ROLE -->
                <div class="form-group">
                  <label for="role"> Role </label>

                  <select id="role" name="role">
                    <option value="staff" selected>Staff</option>
                    <!-- <option value="owner">Owner</option> -->
                  </select>
                </div>

                <!-- INVITATION INFORMATION -->
                <div class="invite-description">
                  <p>From Auckland Map Center</p>
                  <h3>You're invited to the shop's staff area</h3>
                  <p>Set a password to sign-in as admin.</p>
                </div>

                <!-- SEND INVITE BUTTON -->
                <button type="submit" form="invite-form" class="invite-button">
                  Send invite
                </button>

                <div id="invite-message" class="invite-message"></div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/team.js"></script>
  </body>
</html>
