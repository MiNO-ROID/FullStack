<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price Message</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/price.css" />
  </head>
  <body>

    <!-- Dashboard --> 
    <div class="dashboard">
      <!-- left-sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <svg
            id="icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="16" cy="16" r="14" />
            <path d="M16 3.5l3 12.5-3 12.5-3-12.5z" fill="currentColor" />
            <path
              d="M3.5 16l12.5-2 12.5 2-12.5 2z"
              fill="currentColor"
              fill-opacity=".35"
              stroke="none"
            />
          </svg>
        </div>

        <nav class="sidebar-nav">
          <a href="./price.html" class="nav-item" title="Prices">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M3 12V4h8l10 10-8 8z" />
              <circle cx="7.5" cy="8.5" r="1.5" />
            </svg>
          </a>

          <a href="./team.html" class="nav-item" title="Team">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="9" cy="8" r="3.5" />
              <path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5" />
              <path
                d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"
              />
            </svg>
          </a>

          <a href="#" class="nav-item" title="">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18" />
              <path d="M9.5 20v-6h5v6" />
            </svg>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <a href="./signIn.html" class="nav-item" title="Logout">
            <svg
              id="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10" />
            </svg>
          </a>
        </div>
      </aside>

      <!-- main content -->
       <main class="main-content">
        <!-- header -->
        <header class="page-header"> 
          <div class="header-titles">
            <h1>Prices</h1>
            <p class="header-subtitle" id="price-status-subtitle">
              0 of 6,867 prices differ from the old price list. Nothing waiting to save.
            </p>
          </div>
          <div class="header-actions">
            <button type="button" class="btn-secondary" id="discard-btn" disabled>
              Discard
            </button>
            <button type="button" class="btn-primary" id="save-btn" disabled>
              Save changes
            </button>
          </div>
        </header>

        <!-- FILTER TABS BAR -->
        <div class="tabs-bar">
          <div class="filter-tabs" role="tablist">
            <button type="button" class="tab-btn" data-tab="all">
              All products <span class="tab-count" id="tab-all-count"> 6867 </span>
            </button>
            <button type="button" class="tab-btn" data-tab="changed">
              Changed <span class="tab-count" id="tab-changed-count"> 0 </span>
            </button>
            <button type="button" class="tab-btn" data-tab="nophoto">
              No Photos <span class="tab-count" id="tab-nophoto-count"> 6867 </span>
            </button>
          </div>

          <button type="button" class="theme-cycle-btn" id="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">
            <svg width="14" height="18" viewBox="0 0 14 18" fill="currentColor">
              <path d="M7 1l3 3.5H4L7 1zm0 16l-3-3.5h6L7 17z" /> 
              <circle cx="7" cy="9" r="1.6" />
            </svg>
          </button>
        </div>

        <!-- Two-Column-Layout -->

        <div class="content-layout">

          <!-- Left-table-column -->
           <section class="table-section">

           </section>

           <!-- Right -- Change-card -->
            <aside class="department-card">

            </aside>
            
        </div>

        </div>
       </main>
      </div>
  </body>
</html>
