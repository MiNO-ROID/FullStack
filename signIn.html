<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/signIn.css" />
  </head>
  <body>
    <div class="container">
      <!-- <img src=""> -->
      <form class="form" id="form">
        <div class="logo">
          <svg
            id="icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="16" cy="16" r="14" />
            <path d="M16 3.5l3 12.5-3 12.5-3-12.5z" fill="currentColor" />
            <path
              d="M3.5 16l12.5-2 12.5 2-12.5 2z"
              fill="currentColor"
              fill-opacity=".35"
              stroke="none"
            />
          </svg>
        </div>
        <p class="heading">Staff sign in</p>
        <p class="sub-heading">Auckland Map Centre catalogue and prices</p>
        <label for="email" class="header">Email</label> <br />
        <input
          type="email"
          id="email"
          class="email"
          placeholder="manager@aucklandmapcenter.co.nz"
          autocomplete="email"
          required
        />
        <br />
        <label for="password" class="header">Password</label> <br />
        <input
          type="password"
          id="password"
          class="password"
          minlength="8"
          required
        />
        <p class="sub-heading">Use a strong password for security</p>
        <button type="submit" class="submit" id="submit">Sign in</button>

        <p class="hint">
          Accounts are invited-only. Ask the shop owner for an invite.
        </p>
        <span> <a href="#" class="link-heading"> Back to the shop </a> </span>
      </form>
    </div>
    <!-- Load as an ES Module to import Supabase cleanly -->
    <script type="module" src="./js/signIn.js"></script>
 
  </body>
</html>
